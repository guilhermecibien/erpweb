services:
  app:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    expose:
      - "9000"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app

  queue:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600 --timeout=120
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    command: sh -c 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
